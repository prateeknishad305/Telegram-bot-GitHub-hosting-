<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Repo Runner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>

    <header class="appbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="4" />
            <path d="m8 10 2.5 2.5L8 15" />
            <path d="M13.5 15H17" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>Repo Runner</strong>
          <small>GitHub deploy sandbox</small>
        </span>
      </div>
      <span id="who" class="user-chip" hidden></span>
    </header>

    <main>
      <section class="card form-card">
        <div class="card-head">
          <h2>Run a repository</h2>
        </div>
        <label class="field">
          <span class="field-label">Repository URL</span>
          <input id="repo-url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="https://github.com/owner/repo" />
        </label>
        <label class="field">
          <span class="field-label">Branch <em>optional</em></span>
          <input id="repo-branch" type="text" autocomplete="off" spellcheck="false"
                 placeholder="default branch" />
        </label>
        <button id="run-btn" class="btn primary">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">Run repository</span>
        </button>
        <p id="form-msg" class="msg"></p>
      </section>

      <section class="card jobs-card">
        <div class="card-head">
          <h2>Your jobs<span id="job-count" class="count"></span></h2>
          <button id="refresh-btn" class="btn icon ghost" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
        </div>
        <div id="jobs" class="jobs"></div>
      </section>
    </main>

    <div id="terminal-panel" class="sheet" hidden>
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet-body">
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="sheet-head">
          <h2 id="terminal-title">Terminal</h2>
          <button id="terminal-close" class="btn icon ghost" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div id="terminal"></div>
        <p id="terminal-msg" class="msg"></p>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
